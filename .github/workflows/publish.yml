name: Publish packages
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: android-kit
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          path: android-kit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          repository: fridaysundaymood/emu-lab
          ssh-key: ${{ secrets.DEPLOY_KEY_EMU_LAB }}
          path: emu-lab
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          repository: fridaysundaymood/maestro-flow
          ssh-key: ${{ secrets.DEPLOY_KEY_MAESTRO_FLOW }}
          path: maestro-flow
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          repository: fridaysundaymood/supa-multiuser-harness
          ssh-key: ${{ secrets.DEPLOY_KEY_SUPA_MULTIUSER_HARNESS }}
          path: supa-multiuser-harness
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          repository: fridaysundaymood/supa-release-gate-mcp
          ssh-key: ${{ secrets.DEPLOY_KEY_SUPA_RELEASE_GATE_MCP }}
          path: supa-release-gate-mcp
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          repository: fridaysundaymood/indonesian-english-linter
          ssh-key: ${{ secrets.DEPLOY_KEY_INDONESIAN_ENGLISH_LINTER }}
          path: indonesian-english-linter
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build --workspace=@budaknyenyel/kit-schema
      - run: npm ci && npm run build
        working-directory: emu-lab
      - run: npm ci && npm run build
        working-directory: maestro-flow
      - run: npm ci && npm run build
        working-directory: supa-multiuser-harness
      - run: npm ci && npm run build
        working-directory: supa-release-gate-mcp
      - run: npm ci && npm run build
        working-directory: indonesian-english-linter/mcp
      - run: npm run build
      - name: Check tag and prepare publishable manifests
        run: node scripts/prepare-publish.mjs "$RUNNER_TEMP/android-kit-publish" "$GITHUB_REF_NAME"
      - name: Publish schema
        run: npm publish "$RUNNER_TEMP/android-kit-publish/kit-schema" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish server
        run: npm publish "$RUNNER_TEMP/android-kit-publish/server" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish CLI
        run: npm publish "$RUNNER_TEMP/android-kit-publish/cli" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
