name: Publish packages
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-kit
    steps:
      - uses: actions/checkout@v4
        with:
          path: android-kit
      - uses: actions/checkout@v4
        with:
          repository: fridaysundaymood/kit-fixture-app
          path: kit-fixture-app
          token: ${{ secrets.KIT_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: fridaysundaymood/emu-lab
          path: emu-lab
          token: ${{ secrets.KIT_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: fridaysundaymood/maestro-flow
          path: maestro-flow
          token: ${{ secrets.KIT_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: fridaysundaymood/supa-multiuser-harness
          path: supa-multiuser-harness
          token: ${{ secrets.KIT_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: fridaysundaymood/supa-release-gate-mcp
          path: supa-release-gate-mcp
          token: ${{ secrets.KIT_REPOS_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: fridaysundaymood/indonesian-english-linter
          path: indonesian-english-linter
          token: ${{ secrets.KIT_REPOS_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build --workspace=@android-kit/schema
      - run: npm ci && npm run build
        working-directory: emu-lab
      - run: npm ci && npm run build
        working-directory: maestro-flow
      - run: npm ci && npm run build
        working-directory: supa-multiuser-harness
      - run: npm ci && npm run build
        working-directory: supa-release-gate-mcp
      - run: npm ci && npm run build
        working-directory: indonesian-english-linter/mcp
      - run: npm run build
      - run: npm test
        env:
          ANDROID_KIT_FIXTURE: ${{ github.workspace }}/kit-fixture-app
      - name: Check tag and prepare publishable manifests
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const version = process.env.GITHUB_REF_NAME.slice(1);
          for (const dir of fs.readdirSync('packages')) {
            const manifest = path.join('packages', dir, 'package.json');
            if (!fs.existsSync(manifest)) continue;
            const pkg = JSON.parse(fs.readFileSync(manifest, 'utf8'));
            if (pkg.private) continue;
            if (pkg.version !== version) throw new Error(`${pkg.name}: version ${pkg.version} does not match tag v${version}`);
            for (const section of ['dependencies', 'optionalDependencies', 'peerDependencies']) {
              for (const [name, spec] of Object.entries(pkg[section] ?? {})) {
                if (!spec.startsWith('file:')) continue;
                const target = path.resolve(path.dirname(manifest), spec.slice(5), 'package.json');
                const dependency = JSON.parse(fs.readFileSync(target, 'utf8'));
                if (dependency.name !== name) throw new Error(`Dependency name mismatch: ${name}`);
                pkg[section][name] = dependency.version;
              }
            }
            fs.writeFileSync(manifest, `${JSON.stringify(pkg, null, 2)}\n`);
          }
          NODE
      - name: Publish schema
        run: npm publish --workspace=@android-kit/schema --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish server
        run: npm publish --workspace=@android-kit/server --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish CLI
        run: npm publish --workspace=@android-kit/cli --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
