name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  fork-notice:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    steps:
      - run: echo "Sibling-dependent checks are skipped for fork pull requests because deploy keys are unavailable."
  checks:
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: android-kit
    steps:
      - uses: actions/checkout@v4
        with:
          path: android-kit
      - uses: actions/checkout@v4
        with:
          repository: fridaysundaymood/kit-fixture-app
          path: kit-fixture-app
          ssh-key: ${{ secrets.DEPLOY_KEY_KIT_FIXTURE_APP }}
      - uses: actions/checkout@v4
        with:
          repository: fridaysundaymood/emu-lab
          path: emu-lab
          ssh-key: ${{ secrets.DEPLOY_KEY_EMU_LAB }}
      - uses: actions/checkout@v4
        with:
          repository: fridaysundaymood/maestro-flow
          path: maestro-flow
          ssh-key: ${{ secrets.DEPLOY_KEY_MAESTRO_FLOW }}
      - uses: actions/checkout@v4
        with:
          repository: fridaysundaymood/supa-multiuser-harness
          path: supa-multiuser-harness
          ssh-key: ${{ secrets.DEPLOY_KEY_SUPA_MULTIUSER_HARNESS }}
      - uses: actions/checkout@v4
        with:
          repository: fridaysundaymood/supa-release-gate-mcp
          path: supa-release-gate-mcp
          ssh-key: ${{ secrets.DEPLOY_KEY_SUPA_RELEASE_GATE_MCP }}
      - uses: actions/checkout@v4
        with:
          repository: fridaysundaymood/indonesian-english-linter
          path: indonesian-english-linter
          ssh-key: ${{ secrets.DEPLOY_KEY_INDONESIAN_ENGLISH_LINTER }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build --workspace=@android-kit/schema
      - run: npm ci && npm run build
        working-directory: emu-lab
      - run: npm ci && npm run build
        working-directory: maestro-flow
      - run: npm ci && npm run build
        working-directory: supa-multiuser-harness
      - run: npm ci && npm run build
        working-directory: supa-release-gate-mcp
      - run: npm ci && npm run build
        working-directory: indonesian-english-linter/mcp
      - run: npm run lint
      - run: npm run build
      - run: npm test
        env:
          ANDROID_KIT_FIXTURE: ${{ github.workspace }}/kit-fixture-app
